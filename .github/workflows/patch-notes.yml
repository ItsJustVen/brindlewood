name: Update patch notes

# Every 6 hours, copy the newest #patch-notes post from Discord onto the website.
# Does nothing until the DISCORD_BOT_TOKEN and PATCHNOTES_CHANNEL_ID secrets exist.
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch newest patch note
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          PATCHNOTES_CHANNEL_ID: ${{ secrets.PATCHNOTES_CHANNEL_ID }}
        run: node scripts/fetch-patchnotes.mjs
      - name: Publish if it changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$(git status --porcelain src/content/announcements.json)" ]; then
            git config user.name "BrindleWood bot"
            git config user.email "noreply@github.com"
            git add src/content/announcements.json
            git commit -m "Update patch notes from Discord"
            git push origin main
            gh workflow run deploy.yml --ref main
          fi
